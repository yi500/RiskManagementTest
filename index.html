<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風寶分類帽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 模擬原版暗色調背景與邊框變數 */
    :root {
      --background: 20 14.3% 4.1%;
      --foreground: 60 9.1% 97.8%;
      --border: 20 5.9% 25%;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 p-4 md:p-8 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 頂部標題區 -->
    <div class="border-b border-neutral-800 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-xl font-bold text-neutral-50 tracking-wider">選哲你的學院</h1>
        <p class="text-xs text-neutral-400 mt-1">技能方格切換選取（已選狀態外框亮金並打勾），狀態自動儲存至 LocalStorage。</p>
      </div>
      <button onclick="clearAll()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">全部清空</button>
    </div>

    <!-- 1. 當前已規劃結果展示橫條 -->
    <div>
      <div class="text-xs font-medium text-neutral-400 mb-2">已選技能方格：</div>
      <div id="weapon-display-bar" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-neutral-300 bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 min-h-[44px]">
        <!-- 動態渲染展示標籤 -->
      </div>
    </div>

    <!-- 2. 武器九宮格選擇區 -->
    <div>
      <div class="text-xs font-bold text-neutral-400 mb-3">技能方格列表</div>
      <div id="weapon-grid" class="grid grid-cols-[repeat(auto-fill,minmax(6.5rem,1fr))] gap-2">
        <!-- 武器卡片由 JS 動態注入渲染 -->
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'END_WEAPON_PLANNER_DATA';

    // 武器靜態資料庫（提取自原始碼）
const WEAPONS = [
      { id: 'rm_1', name: '企業風險評估', star: 6, char: '辨識' },
      { id: 'rm_2', name: '市場流動性分析', star: 6, char: '金融' },
      { id: 'rm_3', name: '信用違約模型', star: 6, char: '模型' },
      { id: 'rm_4', name: '操作風險稽核', star: 6, char: '內控' },
      { id: 'rm_5', name: '資產負債管理', star: 6, char: '財務' },
      { id: 'rm_6', name: '壓力測試實務', star: 6, char: '情境' },
      { id: 'rm_7', name: '供應鏈中斷應對', star: 6, char: '營運' },
      { id: 'rm_8', name: '資安與資料治理', star: 6, char: '科技' },
      { id: 'rm_9', name: 'ESG與氣候風險', star: 6, char: '永續' },
      { id: 'rm_10', name: '危機決策與處置', star: 6, char: '決策' }
    ];

    // 從 LocalStorage 載入已選武器清單（存武器名稱）
    let selectedWeapons = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // 渲染函式
    function render() {
      // 1. 同步 LocalStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedWeapons));

      // 2. 渲染頂部已選武器橫條
      const bar = document.getElementById('weapon-display-bar');
      if (selectedWeapons.length > 0) {
        bar.innerHTML = `
          <span>已選武器: [ ${selectedWeapons.map(name => `
            <span class="inline-flex items-center gap-1">
              <strong class="text-amber-400 font-semibold">${name}</strong>
              <button onclick="toggleWeapon('${name}')" class="text-neutral-500 hover:text-rose-400 cursor-pointer">✕</button>
            </span>
          `).join(', ')} ]</span>
        `;
      } else {
        bar.innerHTML = '<span class="text-neutral-500 italic">尚未選取任何武器</span>';
      }

      // 3. 渲染網格按鈕
      const grid = document.getElementById('weapon-grid');
      grid.innerHTML = WEAPONS.map(wpn => {
        const isSelected = selectedWeapons.includes(wpn.name);

        // 未選中樣式 vs 原版金黃色高亮選中樣式
        const btnClass = isSelected
          ? 'border-amber-400 shadow-2xl ring-2 ring-amber-400/50 ring-offset-2 ring-offset-neutral-950'
          : 'border-neutral-800 hover:ring-2 hover:ring-white/40';

        // 右上角打勾圖示
        const checkBadge = isSelected ? `
          <div class="absolute top-2 right-2 size-6 rounded-full flex items-center justify-center z-30 shadow-md bg-amber-400 text-black">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </div>
        ` : '';

        // 星級色條底圖（6星金、5星紫）
        const bandBg = wpn.star === 6 ? 'bg-amber-600/30' : 'bg-purple-600/30';

        // 專屬角色頭像標記
        const charBadge = wpn.char ? `
          <div class="absolute top-2 left-2 flex gap-1 z-20">
            <div class="size-7 rounded-full bg-neutral-900/80 border border-white/35 shadow-md flex items-center justify-center text-[10px] text-white">
              ${wpn.char.substring(0, 2)}
            </div>
          </div>
        ` : '';

        return `
          <div class="flex flex-col gap-0.5">
            <button type="button" onclick="toggleWeapon('${wpn.name}')" 
              class="relative flex items-center justify-center aspect-square w-full rounded-lg border cursor-pointer overflow-hidden transition-all select-none bg-neutral-900 ${btnClass}">
              
              <!-- 武器中央文字代碼 -->
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-xs text-neutral-500 font-bold text-center px-1">${wpn.name}</span>
              </div>

              <!-- 角色左上標籤 -->
              ${charBadge}

              <!-- 右上選取打勾標誌 -->
              ${checkBadge}

              <!-- 底部名稱條 -->
              <div class="absolute bottom-0 inset-x-0 z-20 py-1 px-1 text-center ${bandBg}">
                <p class="text-xs font-medium text-neutral-100 truncate">${wpn.name}</p>
              </div>
            </button>
          </div>
        `;
      }).join('');
    }

    // 切換武器選取狀態
    function toggleWeapon(name) {
      const idx = selectedWeapons.indexOf(name);
      if (idx === -1) {
        selectedWeapons.push(name); // 累加並發光
      } else {
        selectedWeapons.splice(idx, 1); // 再次點擊取消
      }
      render();
    }

    // 清空全部
    function clearAll() {
      selectedWeapons = [];
      render();
    }

    // 初次載入渲染
    render();
  </script>
</body>
</html>
