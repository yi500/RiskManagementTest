<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>終末地基質規劃器 - 累加測試</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- 標題與說明 -->
    <div class="border-b border-slate-200 pb-4">
      <h1 class="text-xl font-bold text-slate-900">基質屬性規劃面板</h1>
      <p class="text-xs text-slate-500 mt-1">點擊下方按鈕切換選取狀態（點擊轉藍底白字，再點一次取消），重整不遺失。</p>
    </div>

    <!-- 1. 當前已規劃結果展示橫條 -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-600">目前選擇方案：</span>
        <button onclick="clearAll()" class="text-xs text-rose-500 hover:underline cursor-pointer">全部清空</button>
      </div>

      <div id="attribute-bar" class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-3 text-xs text-slate-600 bg-slate-200/70 border border-slate-300 rounded-md px-3 py-2 min-h-[38px]">
        <!-- 動態渲染展示條 -->
      </div>
    </div>

    <!-- 2. 按鈕選取區 -->
    <div class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm space-y-4">
      <!-- 基礎屬性 -->
      <div>
        <div class="text-xs font-bold text-slate-500 mb-2">基礎屬性</div>
        <div class="flex flex-wrap gap-2">
          <button data-cat="base" data-name="意志提升" onclick="toggleItem('base', '意志提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">意志提升</button>
          <button data-cat="base" data-name="主能力提升" onclick="toggleItem('base', '主能力提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">主能力提升</button>
          <button data-cat="base" data-name="敏捷提升" onclick="toggleItem('base', '敏捷提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">敏捷提升</button>
          <button data-cat="base" data-name="力量提升" onclick="toggleItem('base', '力量提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">力量提升</button>
          <button data-cat="base" data-name="智識提升" onclick="toggleItem('base', '智識提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">智識提升</button>
        </div>
      </div>

      <!-- 附加屬性 -->
      <div>
        <div class="text-xs font-bold text-slate-500 mb-2">附加屬性</div>
        <div class="flex flex-wrap gap-2">
          <button data-cat="extra" data-name="攻擊提升" onclick="toggleItem('extra', '攻擊提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">攻擊提升</button>
          <button data-cat="extra" data-name="暴擊率提升" onclick="toggleItem('extra', '暴擊率提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">暴擊率提升</button>
          <button data-cat="extra" data-name="灼熱傷害提升" onclick="toggleItem('extra', '灼熱傷害提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">灼熱傷害提升</button>
          <button data-cat="extra" data-name="寒冷傷害提升" onclick="toggleItem('extra', '寒冷傷害提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">寒冷傷害提升</button>
          <button data-cat="extra" data-name="電磁傷害提升" onclick="toggleItem('extra', '電磁傷害提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">電磁傷害提升</button>
          <button data-cat="extra" data-name="物理傷害提升" onclick="toggleItem('extra', '物理傷害提升')" class="attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer">物理傷害提升</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'CEP_ESSENCE_PLANNER_DATA';

    // 顏色定義：
    // 未選中：淺灰底、黑字、灰邊框
    const STYLE_UNSELECTED = 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300';
    // 點選後：經典湛藍色、白字、藍邊框、微陰影
    const STYLE_SELECTED = 'bg-blue-600 hover:bg-blue-700 text-white border-blue-600 shadow-sm font-semibold';

    // 讀取快取
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      base: [],
      extra: []
    };

    function render() {
      // 1. 同步 LocalStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      // 2. 渲染上方展示橫條
      const container = document.getElementById('attribute-bar');

      const baseHtml = state.base.length > 0
        ? state.base.map((item) => `
            <span>
              <strong class="text-slate-900 font-medium">${item}</strong>
              <button onclick="removeItem('base', '${item}')" class="text-slate-400 hover:text-rose-500 ml-1 cursor-pointer font-bold">✕</button>
            </span>
          `).join(', ')
        : '<span class="text-slate-400">未選擇</span>';

      const extraHtml = state.extra.length > 0
        ? state.extra.map((item) => `
            <span>
              <strong class="text-slate-900 font-medium">${item}</strong>
              <button onclick="removeItem('extra', '${item}')" class="text-slate-400 hover:text-rose-500 ml-1 cursor-pointer font-bold">✕</button>
            </span>
          `).join(', ')
        : '<span class="text-slate-400">未選擇</span>';

      container.innerHTML = `
        <span>基礎屬性: [ ${baseHtml} ]</span>
        <span class="text-slate-400/50">|</span>
        <span>附加屬性: ${extraHtml}</span>
      `;

      // 3. 即時變更按鈕藍色高亮
      document.querySelectorAll('.attr-btn').forEach(btn => {
        const cat = btn.getAttribute('data-cat');
        const name = btn.getAttribute('data-name');
        const isSelected = state[cat].includes(name);

        btn.className = `attr-btn px-3 py-1.5 text-xs rounded border transition-colors duration-150 cursor-pointer ${
          isSelected ? STYLE_SELECTED : STYLE_UNSELECTED
        }`;
      });
    }

    // 點擊觸發：加入/移除切換
    function toggleItem(category, name) {
      const idx = state[category].indexOf(name);
      if (idx === -1) {
        state[category].push(name); // 變藍
      } else {
        state[category].splice(idx, 1); // 恢復灰色
      }
      render();
    }

    // 移除單項
    function removeItem(category, name) {
      state[category] = state[category].filter(item => item !== name);
      render();
    }

    // 清空全部
    function clearAll() {
      state.base = [];
      state.extra = [];
      render();
    }

    // 啟動渲染
    render();
  </script>
</body>
</html>
