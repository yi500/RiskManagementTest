<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>終末地基質規劃器 - 武器選擇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 模擬原版暗色調背景與邊框變數 */
    :root {
      --background: 20 14.3% 4.1%;
      --foreground: 60 9.1% 97.8%;
      --border: 20 5.9% 25%;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 p-4 md:p-8 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 頂部標題區 -->
    <div class="border-b border-neutral-800 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-xl font-bold text-neutral-50 tracking-wider">終末地基質規劃器</h1>
        <p class="text-xs text-neutral-400 mt-1">點擊武器方格切換選取（已選狀態外框亮金並打勾），狀態自動儲存至 LocalStorage。</p>
      </div>
      <button onclick="clearAll()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">全部清空</button>
    </div>

    <!-- 1. 當前已規劃結果展示橫條 -->
    <div>
      <div class="text-xs font-medium text-neutral-400 mb-2">已選武器方案：</div>
      <div id="weapon-display-bar" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-neutral-300 bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 min-h-[44px]">
        <!-- 動態渲染展示標籤 -->
      </div>
    </div>

    <!-- 2. 武器九宮格選擇區 -->
    <div>
      <div class="text-xs font-bold text-neutral-400 mb-3">武器列表</div>
      <div id="weapon-grid" class="grid grid-cols-[repeat(auto-fill,minmax(6.5rem,1fr))] gap-2">
        <!-- 武器卡片由 JS 動態注入渲染 -->
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'END_WEAPON_PLANNER_DATA';

    // 武器靜態資料庫（提取自原始碼）
    const WEAPONS = [
      { id: 'wpn_1', name: '点心时刻', star: 5, avatar: 'preview-2117.avif', char: '噗切娜' },
      { id: 'wpn_2', name: '寒夜幽影', star: 6, avatar: 'chr_0034_typhoea.avif', char: '提弗洛斯', isUp: true },
      { id: 'wpn_3', name: '黯色火炬', star: 6 },
      { id: 'wpn_4', name: '白夜新星', star: 6 },
      { id: 'wpn_5', name: '爆破單元', star: 6 },
      { id: 'wpn_6', name: '不知歸', star: 6, avatar: 'chr_0029_pograni.avif', char: '骏卫' },
      { id: 'wpn_7', name: '滄溟星夢', star: 6, avatar: 'chr_0025_ardelia.avif', char: '艾尔黛拉' },
      { id: 'wpn_8', name: '赤纓', star: 6, avatar: 'chr_0031_mifu.avif', char: '弭弗' },
      { id: 'wpn_9', name: '大雷斑', star: 6, avatar: 'chr_0009_azrila.avif', char: '余烬' },
      { id: 'wpn_10', name: '燈火使命', star: 6 },
      { id: 'wpn_11', name: '典範', star: 6, avatar: 'chr_0018_dapan.avif', char: '大潘' },
      { id: 'wpn_12', name: '鍍紅祝福', star: 6, avatar: 'chr_0033_camille.avif', char: '卡缪' },
      { id: 'wpn_13', name: '扶搖', star: 6, avatar: 'chr_0005_chen.avif', char: '陈千语' },
      { id: 'wpn_14', name: '負山', star: 6, avatar: 'chr_0015_lifeng.avif', char: '黎风' },
      { id: 'wpn_15', name: '孤舟', star: 6, avatar: 'chr_0030_zhuangfy.avif', char: '庄方宜' },
      { id: 'wpn_16', name: '光榮記憶', star: 6 },
      { id: 'wpn_17', name: '赫拉芬格', star: 6, avatar: 'chr_0026_lastrite.avif', char: '别礼' },
      { id: 'wpn_18', name: '宏願', star: 6, avatar: 'chr_9000_endmin.avif', char: '管理员' },
      { id: 'wpn_19', name: '幻想苦痛', star: 6 },
      { id: 'wpn_20', name: '黃金時代', star: 6 },
      { id: 'wpn_21', name: '苦難的盡頭', star: 6 },
      { id: 'wpn_22', name: '狼之緋', star: 6, avatar: 'chr_0028_wulfa.avif', char: '洛茜' },
      { id: 'wpn_23', name: '聯結點', star: 6 },
      { id: 'wpn_24', name: '領航者', star: 6 },
      { id: 'wpn_25', name: '落草', star: 6, avatar: 'chr_0027_tangtang.avif', char: '汤汤' },
      { id: 'wpn_26', name: '破碎君王', star: 6 },
      { id: 'wpn_27', name: '騎士精神', star: 6 },
      { id: 'wpn_28', name: '熱熔切割器', star: 6 },
      { id: 'wpn_29', name: '熔鑄火焰', star: 6, avatar: 'chr_0016_laevat.avif', char: '莱万汀' },
      { id: 'wpn_30', name: '使命必達', star: 6, avatar: 'chr_0013_aglina.avif', char: '洁尔佩塔' },
      { id: 'wpn_31', name: '四二式·肅陣', star: 6, avatar: 'chr_0032_lizhiyan.avif', char: '诀' },
      { id: 'wpn_32', name: '同類相食', star: 6, avatar: 'chr_0006_wolfgd.avif', char: '狼卫' },
      { id: 'wpn_33', name: '望鄉', star: 6 },
      { id: 'wpn_34', name: '霧中微光', star: 6 },
      { id: 'wpn_35', name: '昔日精品', star: 6 },
      { id: 'wpn_36', name: '顯赫聲名', star: 6 },
      { id: 'wpn_37', name: '驍勇', star: 6 },
      { id: 'wpn_38', name: '楔子', star: 6 },
      { id: 'wpn_39', name: '遙望', star: 6 },
      { id: 'wpn_40', name: '曜夜的首演', star: 6, avatar: 'chr_0035_liino.avif', char: '梨诺' },
      { id: 'wpn_41', name: '遺忘', star: 6 },
      { id: 'wpn_42', name: '藝術暴君', star: 6, avatar: 'chr_0017_yvonne.avif', char: '伊冯' },
      { id: 'wpn_43', name: '作品：蝕跡', star: 6 },
      { id: 'wpn_44', name: 'J.E.T.', star: 6 },
      { id: 'wpn_45', name: '佈道自由', star: 5 },
      { id: 'wpn_46', name: '悼亡詩', star: 5 },
      { id: 'wpn_47', name: '鋼鐵餘音', star: 5 },
      { id: 'wpn_48', name: '古渠', star: 5 },
      { id: 'wpn_49', name: '堅城鑄造者', star: 5 },
      { id: 'wpn_50', name: '理性告別', star: 5 },
      { id: 'wpn_51', name: '迷失荒野', star: 5 },
      { id: 'wpn_52', name: '莫奈何', star: 5 },
      { id: 'wpn_53', name: '嵌合正義', star: 5 },
      { id: 'wpn_54', name: '十二問', star: 5 },
      { id: 'wpn_55', name: '探驪', star: 5 },
      { id: 'wpn_56', name: '向心之引', star: 5 },
      { id: 'wpn_57', name: '仰止', star: 5 },
      { id: 'wpn_58', name: '終點之聲', star: 5, avatar: 'chr_0014_aurora.avif', char: '昼雪' },
      { id: 'wpn_59', name: '逐鱗3.0', star: 5 },
      { id: 'wpn_60', name: '作品：眾生', star: 5 },
      { id: 'wpn_61', name: 'O.B.J.尖峰', star: 5 },
      { id: 'wpn_62', name: 'O.B.J.輕芒', star: 5 },
      { id: 'wpn_63', name: 'O.B.J.術識', star: 5 },
      { id: 'wpn_64', name: 'O.B.J.迅極', star: 5 },
      { id: 'wpn_65', name: 'O.B.J.重荷', star: 5 }
    ];

    // 從 LocalStorage 載入已選武器清單（存武器名稱）
    let selectedWeapons = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // 渲染函式
    function render() {
      // 1. 同步 LocalStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedWeapons));

      // 2. 渲染頂部已選武器橫條
      const bar = document.getElementById('weapon-display-bar');
      if (selectedWeapons.length > 0) {
        bar.innerHTML = `
          <span>已選武器: [ ${selectedWeapons.map(name => `
            <span class="inline-flex items-center gap-1">
              <strong class="text-amber-400 font-semibold">${name}</strong>
              <button onclick="toggleWeapon('${name}')" class="text-neutral-500 hover:text-rose-400 cursor-pointer">✕</button>
            </span>
          `).join(', ')} ]</span>
        `;
      } else {
        bar.innerHTML = '<span class="text-neutral-500 italic">尚未選取任何武器</span>';
      }

      // 3. 渲染網格按鈕
      const grid = document.getElementById('weapon-grid');
      grid.innerHTML = WEAPONS.map(wpn => {
        const isSelected = selectedWeapons.includes(wpn.name);

        // 未選中樣式 vs 原版金黃色高亮選中樣式
        const btnClass = isSelected
          ? 'border-amber-400 shadow-2xl ring-2 ring-amber-400/50 ring-offset-2 ring-offset-neutral-950'
          : 'border-neutral-800 hover:ring-2 hover:ring-white/40';

        // 右上角打勾圖示
        const checkBadge = isSelected ? `
          <div class="absolute top-2 right-2 size-6 rounded-full flex items-center justify-center z-30 shadow-md bg-amber-400 text-black">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </div>
        ` : '';

        // 星級色條底圖（6星金、5星紫）
        const bandBg = wpn.star === 6 ? 'bg-amber-600/30' : 'bg-purple-600/30';

        // 專屬角色頭像標記
        const charBadge = wpn.char ? `
          <div class="absolute top-2 left-2 flex gap-1 z-20">
            <div class="size-7 rounded-full bg-neutral-900/80 border border-white/35 shadow-md flex items-center justify-center text-[10px] text-white">
              ${wpn.char.substring(0, 2)}
            </div>
          </div>
        ` : '';

        return `
          <div class="flex flex-col gap-0.5">
            <button type="button" onclick="toggleWeapon('${wpn.name}')" 
              class="relative flex items-center justify-center aspect-square w-full rounded-lg border cursor-pointer overflow-hidden transition-all select-none bg-neutral-900 ${btnClass}">
              
              <!-- 武器中央文字代碼 -->
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-xs text-neutral-500 font-bold text-center px-1">${wpn.name}</span>
              </div>

              <!-- 角色左上標籤 -->
              ${charBadge}

              <!-- 右上選取打勾標誌 -->
              ${checkBadge}

              <!-- 底部名稱條 -->
              <div class="absolute bottom-0 inset-x-0 z-20 py-1 px-1 text-center ${bandBg}">
                <p class="text-xs font-medium text-neutral-100 truncate">${wpn.name}</p>
              </div>
            </button>
          </div>
        `;
      }).join('');
    }

    // 切換武器選取狀態
    function toggleWeapon(name) {
      const idx = selectedWeapons.indexOf(name);
      if (idx === -1) {
        selectedWeapons.push(name); // 累加並發光
      } else {
        selectedWeapons.splice(idx, 1); // 再次點擊取消
      }
      render();
    }

    // 清空全部
    function clearAll() {
      selectedWeapons = [];
      render();
    }

    // 初次載入渲染
    render();
  </script>
</body>
</html>
