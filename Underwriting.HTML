<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核保理賠規劃器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 p-4 md:p-8 font-sans min-h-screen">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- 頂部標題區 -->
    <div class="border-b border-neutral-800 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-xl font-bold text-neutral-50 tracking-wider">核保理賠能力規劃器</h1>
        <p class="text-xs text-neutral-400 mt-1">點選課程方格進行配置，選取數量將即時評估整體防禦成熟度。</p>
      </div>
      <button onclick="clearAll()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">全部清空</button>
    </div>

    <!-- 1. 動態評語與清單展示橫條 -->
    <div class="space-y-2">
      <!-- 依選取數量動態變化的句子 -->
      <div id="status-comment-box" class="p-3 rounded-lg border text-xs transition-all duration-300">
        <!-- 動態句子渲染在此 -->
      </div>

      <!-- 已選技能標籤列 -->
      <div class="text-xs font-medium text-neutral-400">已配置課程模組：</div>
      <div id="weapon-display-bar" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-neutral-300 bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 min-h-[44px]">
        <!-- 動態渲染清單 -->
      </div>
    </div>

    <!-- 2. 10 格風險管理課程（全部預設 6 星） -->
    <div>
      <div class="text-xs font-bold text-neutral-400 mb-3">風險管理專業核心（共 10 門）</div>
      <div id="weapon-grid" class="grid grid-cols-[repeat(auto-fill,minmax(7.5rem,1fr))] gap-2.5">
        <!-- 課程卡片由 JS 動態注入 -->
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'RM_COURSE_PLANNER_DATA';

    // 1. 定義星級對應的分數規則
    const STAR_POINTS = {
      6: 10, // 6 星 = 10 分
      5: 7,  // 5 星 = 7 分
      4: 4,  // 4 星 = 4 分
      3: 2   // 3 星 = 2 分
    };

    // 2. 當前頁面的 10 門課程
    const COURSES = [
      { id: 'uc_1', name: '保險核保實務', star: 6, tag: '核保' },
      { id: 'uc_2', name: '風險辨識與承保判斷', star: 6, tag: '判斷' },
      { id: 'uc_3', name: '保險條款與責任分析', star: 6, tag: '條款' },
      { id: 'uc_4', name: '理賠案件審查實務', star: 6, tag: '理賠' },
      { id: 'uc_5', name: '理賠調查與證據判讀', star: 6, tag: '調查' },
      { id: 'uc_6', name: '損失評估與理賠決策', star: 6, tag: '評估' },
      { id: 'uc_7', name: '詐欺識別與異常案件分析', star: 6, tag: '防詐' },
      { id: 'uc_8', name: '核保理賠法遵與爭議處理', star: 6, tag: '法遵' },
      { id: 'uc_9', name: '複雜案件風險與責任判斷', star: 6, tag: '專業' },
      { id: 'uc_10', name: '核保理賠綜合決策實務', star: 6, tag: '決策' }
    ];

    // 3. 全局星級對照表（確保無論哪個頁面存進去的課程，都能查到星級）
    const ALL_COURSES_LOOKUP = {
      // 本頁核保理賠模組
      '保險核保實務': 6,
      '風險辨識與承保判斷': 6,
      '保險條款與責任分析': 6,
      '理賠案件審查實務': 6,
      '理賠調查與證據判讀': 6,
      '損失評估與理賠決策': 6,
      '詐欺識別與異常案件分析': 6,
      '核保理賠法遵與爭議處理': 6,
      '複雜案件風險與責任判斷': 6,
      '核保理賠綜合決策實務': 6,

      // 風險管理模組（跨模組加入）
      '企業風險評估': 6,
      '市場流動性分析': 6,
      '信用違約模型': 6,
      '操作風險稽核': 6,
      '資產負債管理': 6,
      '壓力測試實務': 6,
      '供應鏈中斷應對': 6,
      '資安與資料治理': 6,
      'ESG與氣候風險': 6,
      '危機決策與處置': 6
    };

    let selectedCourses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // 根據門數與分數計算評語
    function getAssessment(count, totalScore) {
      if (count === 0) {
        return {
          theme: 'bg-neutral-900/60 border-neutral-800 text-neutral-400',
          title: '尚未配置任何職能',
          desc: '請由下方點選課程方格，開始累積專業核保理賠戰力積分。'
        };
      } else if (totalScore < 30) {
        return {
          theme: 'bg-amber-950/20 border-amber-800/50 text-amber-300',
          title: `基礎審查資質（已選 ${count} 門 · 總分 ${totalScore} 分）`,
          desc: '具備基層案件常規判讀與審查意識，但關鍵高階決策職能佔比仍低，面對疑難爭議案件建議轉交資深人員協同覆核。'
        };
      } else if (totalScore < 60) {
        return {
          theme: 'bg-blue-950/20 border-blue-800/50 text-blue-300',
          title: `中階專業架構（已選 ${count} 門 · 總分 ${totalScore} 分）`,
          desc: '已具備完整之常態案件調查與契約判讀能力，能獨立處置大部分爭端，建議補強防詐分析與複合巨災風險評估。'
        };
      } else if (totalScore < 90) {
        return {
          theme: 'bg-indigo-950/20 border-indigo-700/60 text-indigo-300',
          title: `資深核賠專家（已選 ${count} 門 · 總分 ${totalScore} 分）`,
          desc: '專業積分深厚！兼具條款深度與複雜決策視角，各項風控機制緊密串聯，足以承擔重大賠案與高額承保決策。'
        };
      } else {
        return {
          theme: 'bg-emerald-950/30 border-emerald-500/60 text-emerald-300',
          title: `全維度卓越領航（已選 ${count} 門 · 總分 ${totalScore} 分）`,
          desc: '積分封頂！達成跨領域高階核保理賠完整閉環，兼備精準定價、逆選擇防弊與爭議處置能力，展現最高規格專業成熟度。'
        };
      }
    }

    function render() {
      // 1. 同步 LocalStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedCourses));
      const count = selectedCourses.length;

      // 2. 核心計算：遍歷橫條出現的每一個項目，查表加總分數
      let totalScore = 0;
      selectedCourses.forEach(courseName => {
        // 先查全局表，若沒有則預設 6 星
        const stars = ALL_COURSES_LOOKUP[courseName] || 6;
        totalScore += (STAR_POINTS[stars] || 0);
      });

      // 3. 渲染狀態評語方框
      const assessment = getAssessment(count, totalScore);
      const commentBox = document.getElementById('status-comment-box');
      commentBox.className = `p-3 rounded-lg border text-xs transition-all duration-300 ${assessment.theme}`;
      commentBox.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="font-bold text-sm">${assessment.title}</span>
          <span class="px-2 py-0.5 rounded bg-white/10 font-mono font-bold text-xs tracking-wide">
            得分：${totalScore}
          </span>
        </div>
        <div class="opacity-90 leading-relaxed">${assessment.desc}</div>
      `;

      // 4. 渲染頂部已選模組橫條（附帶顯示該項目的星級與分數）
      const bar = document.getElementById('weapon-display-bar');
      if (count > 0) {
        bar.innerHTML = `
          <span>已選模組: [ ${selectedCourses.map(name => {
            const stars = ALL_COURSES_LOOKUP[name] || 6;
            const pts = STAR_POINTS[stars] || 0;
            return `
              <span class="inline-flex items-center gap-1">
                <strong class="text-amber-400 font-semibold">${name}</strong>
                <span class="text-[10px] text-amber-500/80 font-mono">(${stars}★/+${pts})</span>
                <button onclick="toggleCourse('${name}')" class="text-neutral-500 hover:text-rose-400 cursor-pointer font-bold ml-0.5">✕</button>
              </span>
            `;
          }).join(', ')} ]</span>
        `;
      } else {
        bar.innerHTML = '<span class="text-neutral-500 italic">尚未配置課程</span>';
      }

      // 5. 渲染下方 10 格卡片
      const grid = document.getElementById('weapon-grid');
      grid.innerHTML = COURSES.map(course => {
        const isSelected = selectedCourses.includes(course.name);
        const starCount = course.star || 6;
        const starStr = '★'.repeat(starCount);
        const score = STAR_POINTS[starCount] || 0;

        const btnClass = isSelected
          ? 'border-amber-400 shadow-xl ring-2 ring-amber-400/50 ring-offset-2 ring-offset-neutral-950 bg-neutral-900/90'
          : 'border-neutral-800 hover:ring-2 hover:ring-neutral-600 bg-neutral-900';

        return `
          <div class="flex flex-col gap-0.5">
            <button type="button" onclick="toggleCourse('${course.name}')" 
              class="relative flex flex-col items-center justify-between aspect-square w-full rounded-lg border cursor-pointer overflow-hidden transition-all select-none p-2 ${btnClass}">
              
              <div class="w-full flex justify-between items-center">
                <span class="text-[10px] px-1.5 py-0.5 rounded ${isSelected ? 'bg-amber-500/20 text-amber-300' : 'bg-neutral-800 text-neutral-300'} font-medium">${course.tag}</span>
                <span class="text-[10px] font-mono opacity-60">+${score}分</span>
              </div>

              <div class="flex flex-col items-center justify-center my-auto">
                <span class="text-amber-400 text-xs tracking-tighter">${starStr}</span>
                <span class="text-xs ${isSelected ? 'text-amber-200' : 'text-neutral-200'} font-bold mt-1 text-center leading-tight px-1">${course.name}</span>
              </div>

              <div class="w-full py-0.5 text-center ${isSelected ? 'bg-amber-500/30 border-amber-400/40 text-amber-300' : 'bg-amber-500/10 border-amber-500/20 text-neutral-400'} border-t rounded-b">
                <p class="text-[10px] font-semibold">Level ${starCount} 核心</p>
              </div>
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleCourse(name) {
      const idx = selectedCourses.indexOf(name);
      if (idx === -1) {
        selectedCourses.push(name);
      } else {
        selectedCourses.splice(idx, 1);
      }
      render();
    }

    function clearAll() {
      selectedCourses = [];
      render();
    }

    render();
  </script>
   <p class="text-xs text-neutral-400 mt-1">如果沒有顯示每門課加總，記得稍後重整呦</p>
</body>
</html>
